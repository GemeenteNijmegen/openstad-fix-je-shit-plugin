name: Publish to GitHub Packages

# Push een versie-tag (bv. v1.0.0) -> publiceert het pakket naar
# GitHub Packages onder de GemeenteNijmegen-organisatie.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@gemeentenijmegen"

      # Installeert devDeps (esbuild); `prepare` bouwt dist/ vóór publish.
      - run: npm ci

      - run: npm publish
        env:
          # De ingebouwde token heeft packages:write op deze repo.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
